<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - DESIGNMEN BD Portal</title>
  <link rel="icon" type="image/jpeg" href="https://lh3.googleusercontent.com/d/1ZCTtF1EZVR419OA-1pMz4uf0T-DjpukU" sizes="64x64">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#2563eb;--primary-dark:#1e40af;--border:#dbe3ef;--muted:#64748b;--text:#0f172a;--danger:#dc2626;--success:#047857;--soft:#eff6ff}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.25rem;background:radial-gradient(circle at 15% 10%,#dbeafe 0,transparent 35%),linear-gradient(135deg,#f8fbff 0%,#f8fafc 55%,#ecfeff 100%);font-family:'Outfit',sans-serif;color:var(--text)}.card{width:min(440px,100%);padding:clamp(1.5rem,5vw,2.35rem);background:rgba(255,255,255,.96);border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 60px rgba(15,23,42,.14)}.brand{text-align:center;margin-bottom:1.65rem}.brand img{width:64px;height:64px;object-fit:cover;margin-bottom:.7rem}.brand h1{margin:0;color:var(--primary-dark);font-size:1.35rem}.brand p{margin:.35rem 0 0;color:var(--muted);font-size:.88rem}.intro{margin:0 0 1.25rem;padding:.8rem .9rem;border-left:3px solid #60a5fa;background:var(--soft);color:#334155;font-size:.86rem;line-height:1.5}.field{display:grid;gap:.4rem;margin-bottom:1rem}.field label{font-size:.83rem;font-weight:600}.field input{width:100%;padding:.78rem .85rem;border:1px solid var(--border);border-radius:7px;font:400 .95rem 'Outfit',sans-serif;outline:none}.field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.12)}.hint{margin:-.45rem 0 1rem;color:var(--muted);font-size:.76rem}button{width:100%;padding:.78rem;border:0;border-radius:7px;background:var(--primary);color:#fff;font:600 .95rem 'Outfit',sans-serif;cursor:pointer}button:hover{background:var(--primary-dark)}button:disabled{opacity:.6;cursor:wait}.back{display:block;margin-top:1rem;text-align:center;color:var(--primary);text-decoration:none;font-size:.9rem}.message{min-height:1.25rem;margin-top:.9rem;text-align:center;font-size:.83rem;color:var(--danger)}.message.success{color:var(--success)}.password-wrap{position:relative}.password-wrap input{padding-right:2.8rem}.toggle{position:absolute;right:.35rem;top:50%;transform:translateY(-50%);width:2rem;padding:.25rem;background:transparent;color:var(--muted);font-size:1rem}.toggle:hover{background:transparent;color:var(--primary)}
    .brand img{width:64px;height:64px;padding:0;border:0;border-radius:0;background:transparent;object-fit:contain}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand"><img src="https://lh3.googleusercontent.com/d/1ZCTtF1EZVR419OA-1pMz4uf0T-DjpukU" alt="DESIGNMEN logo"><h1>DESIGNMEN BD Portal</h1><p>Password recovery</p></div>

    <p class="intro" id="requestIntro">Enter your registered email. Supabase will send you a password reset link.</p>
    <form id="requestForm">
      <div class="field"><label for="recoveryEmail">Email</label><input id="recoveryEmail" type="email" autocomplete="email" placeholder="Enter your registered email" required></div>
      <button id="sendButton" type="submit">Send reset link</button>
      <div id="requestMessage" class="message" role="alert"></div>
    </form>

    <form id="newPasswordForm" style="display:none;">
      <p class="intro">Your reset link has been verified. Set your new password.</p>
      <div class="field"><label for="resetEmail">Email</label><input id="resetEmail" type="email" autocomplete="email" readonly required></div>
      <div class="field"><label for="newPassword">New password</label><div class="password-wrap"><input id="newPassword" type="password" autocomplete="new-password" required><button class="toggle" id="newPasswordToggle" type="button" aria-label="Show password">&#128065;</button></div></div>
      <div class="field"><label for="confirmPassword">Confirm password</label><div class="password-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" required><button class="toggle" id="confirmPasswordToggle" type="button" aria-label="Show password">&#128065;</button></div></div>
      <p class="hint">Your password must be at least 6 characters long.</p>
      <button id="updateButton" type="submit">Set new password</button>
      <div id="updateMessage" class="message" role="alert"></div>
    </form>

    <a class="back" href="Login.html">Back to login</a>
  </main>
  <script>
    const SUPABASE_URL = 'https://elymgmzexvrbxmlzoohf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_hnTeB0bxmdQE5ugTBKuPCQ_DXL38Zqx';
    const PASSWORD_RESET_REDIRECT_URL = 'https://designmenislamabad-eng.github.io/BD-Dashboard/ResetPassword.html';
    let recoveryAccessToken = '';

    function togglePassword(button, input) {
      const visible = input.type === 'text';
      input.type = visible ? 'password' : 'text';
      button.setAttribute('aria-label', visible ? 'Show password' : 'Hide password');
    }

    function getPasswordResetRedirectUrl() {
      return PASSWORD_RESET_REDIRECT_URL;
    }

    function showRecoveryForm() {
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const query = new URLSearchParams(window.location.search);
      const authType = hash.get('type') || query.get('type');
      const error = hash.get('error_description') || query.get('error_description');
      recoveryAccessToken = hash.get('access_token') || query.get('access_token') || '';

      if (error) {
        const message = document.getElementById('requestMessage');
        message.textContent = error.replace(/\+/g, ' ');
        return;
      }

      if (recoveryAccessToken) {
        document.getElementById('requestForm').style.display = 'none';
        document.getElementById('newPasswordForm').style.display = 'block';
        document.getElementById('updateMessage').className = 'message success';
        document.getElementById('updateMessage').textContent = 'Email verified. Loading your account...';
        fetch(SUPABASE_URL + '/auth/v1/user', {
          headers: {'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + recoveryAccessToken}
        }).then(function(response) {
          if (!response.ok) throw new Error('Reset link expired. Please request a new link.');
          return response.json();
        }).then(function(user) {
          document.getElementById('resetEmail').value = user.email || '';
          document.getElementById('updateMessage').textContent = 'Email verified. Set your new password.';
        }).catch(function(error) {
          document.getElementById('updateMessage').className = 'message';
          document.getElementById('updateMessage').textContent = error.message;
        });
      } else if (authType === 'recovery') {
        document.getElementById('requestMessage').textContent = 'Reset link expired or incomplete. Please request a new link.';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      const newPassword = document.getElementById('newPassword');
      const confirmPassword = document.getElementById('confirmPassword');
      const recoveryEmail = document.getElementById('recoveryEmail');
      const emailFromLogin = new URLSearchParams(window.location.search).get('email');

      if (emailFromLogin) recoveryEmail.value = emailFromLogin;

      document.getElementById('newPasswordToggle').addEventListener('click', function() { togglePassword(this, newPassword); });
      document.getElementById('confirmPasswordToggle').addEventListener('click', function() { togglePassword(this, confirmPassword); });

      document.getElementById('requestForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const email = document.getElementById('recoveryEmail').value.trim().toLowerCase();
        const button = document.getElementById('sendButton');
        const message = document.getElementById('requestMessage');
        const redirectUrl = getPasswordResetRedirectUrl();
        button.disabled = true;
        button.textContent = 'Sending...';
        message.className = 'message';
        message.textContent = '';

        fetch(SUPABASE_URL + '/auth/v1/recover?redirect_to=' + encodeURIComponent(redirectUrl), {
          method: 'POST',
          headers: {'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},
          body: JSON.stringify({email: email})
        }).then(function(response) {
          if (!response.ok) return response.json().then(function(result) {
            const details = result.error_description || result.msg || result.message || '';
            if (response.status === 429 || /rate limit|too many|exceeded/i.test(details)) {
              throw new Error('Email rate limit exceeded. Please wait a while and try again.');
            }
            throw new Error(details || 'Unable to send reset email.');
          });
          return response.text();
        }).then(function() {
          message.className = 'message success';
          message.textContent = 'Reset link sent. Please check your email.';
        }).catch(function(error) {
          message.textContent = error.message || 'Unable to send reset email.';
        }).finally(function() {
          button.disabled = false;
          button.textContent = 'Send reset link';
        });
      });

      document.getElementById('newPasswordForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const password = newPassword.value;
        const confirmation = confirmPassword.value;
        const button = document.getElementById('updateButton');
        const message = document.getElementById('updateMessage');

        if (!recoveryAccessToken) { message.textContent = 'Reset link expired. Request a new link.'; return; }
        if (password.length < 6) { message.textContent = 'Password must be at least 6 characters.'; return; }
        if (password !== confirmation) { message.textContent = 'Passwords do not match.'; return; }

        button.disabled = true;
        button.textContent = 'Updating...';
        message.textContent = '';
        fetch(SUPABASE_URL + '/auth/v1/user', {
          method: 'PUT',
          headers: {'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+recoveryAccessToken},
          body: JSON.stringify({password: password})
        }).then(function(response) {
          if (!response.ok) return response.json().then(function(result) { throw new Error(result.error_description || result.msg || 'Unable to update password.'); });
          return response.json();
        }).then(function() {
          message.className = 'message success';
          message.textContent = 'Password updated successfully. You can now log in.';
          recoveryAccessToken = '';
          window.sessionStorage.removeItem('supabase.auth.token');
          window.history.replaceState({}, document.title, window.location.pathname);
          setTimeout(function() { window.location.href = 'Login.html'; }, 1200);
        }).catch(function(error) {
          message.textContent = error.message || 'Unable to update password.';
          button.disabled = false;
          button.textContent = 'Set new password';
        });
      });

      showRecoveryForm();
    });
  </script>
</body>
</html>
